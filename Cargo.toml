[package]
name = "simpbar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"
chrono = "0.4.45"
cosmic-text = "0.19.0"
env_logger = "0.11.11"
fontdb = { version = "0.23", default-features = false }
freedesktop-icons = "0.4.0"
libc = "0.2.191"
log = "0.4.34"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
system-tray = "0.8.9"
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = true
strip = true
